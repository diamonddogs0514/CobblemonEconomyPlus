# Project properties & versions
mod_group=com.diamo.cobblemoneconomyplus
mod_id=cobblemon_economy_plus
mod_name=Cobblemon Economy Plus
mod_authors=diamo
mod_version=0.1.0
mod_description=An economy add-on for Cobblemon on Minecraft 1.21.1.

# Distribution license (see LICENSE.md).
mod_license=MIT

java_version=21

# The minecraft version used for compiling and testing
minecraft_version=1.21.1
# Heap limits for Minecraft development run configurations. These are separate from
# org.gradle.jvmargs, which controls the Gradle daemon itself.
game_jvm_xms=1G
game_jvm_xmx=6G
# The minecraft version ranges for fabric.mod.json and neoforge.mods.toml respectively
mc_versions_fabric=1.21.1
mc_versions_neo=[1.21.1,1.22)

# The neoforge version used for compiling and testing
neoforge_version=21.1.233
# range of allowed neo loader versions (used in neoforge.mods.toml)
neo_loader_version_range=[4,)

# check these versions on https://fabricmc.net/develop/
fabric_loader_version=0.19.3
# if you don't need fabric api, you can remove this line as well as the one in fabric/build.gradle.kts
fabric_api_version=0.116.12+1.21.1
# Matches the version bundled inside Cobblemon 1.8.4; needed explicitly for Loom's dev runtime.
fabric_language_kotlin_version=1.13.6+kotlin.2.2.20
cobblemon_graal_version=22.3.0
cobblemon_icu4j_version=71.1
cobblemon_mongodb_version=4.10.2

# Cobblemon development dependencies. Modrinth Maven uses project-version IDs so
# Fabric and NeoForge can be pinned to their respective official builds.
cobblemon_version=1.8.4
cobblemon_fabric_version_id=PdOzYHKU
cobblemon_neoforge_version_id=xsVHrAsY
kotlin_for_forge_version_id=uhJhCT7X

# Done to improve gradle performance.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
 # org.gradle.configuration-cache=true
