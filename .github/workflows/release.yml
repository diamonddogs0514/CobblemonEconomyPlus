name: Build and Release

on:
  release:
    # Only when a release is published (not on create / edit too), so each version is uploaded once.
    types: [published]
  # Manual run for an already published release, e.g. to upload one loader again after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload (e.g. v1.2.0)
        required: true
      loaders:
        description: Which loaders to upload
        type: choice
        options: [both, fabric, neoforge]
        default: both

# Publishing to Modrinth and CurseForge needs the repository secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN.
env:
  MODRINTH_ID: M7XGBo0H
  CURSEFORGE_ID: 1794401
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  LOADERS: ${{ inputs.loaders || 'both' }}

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Read the release name
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "name=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)" >> "$GITHUB_OUTPUT"

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Upload Fabric artifacts
        if: env.LOADERS != 'neoforge'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: ${{ steps.release.outputs.name }} (Fabric)
          # Cobblemon 1.8.4 runs on 1.21.1 only; do not let a version range expand to every 1.21.x.
          game-versions: 1.21.1
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-tag: ${{ env.RELEASE_TAG }}
          github-token: ${{ secrets.GITHUB_TOKEN }} # GitHub token is provided by GH automatically

          files: |
            build/libs_fabric/!(*-@(dev|sources|all)).jar
            build/libs_fabric/*-@(dev|sources|all).jar

      - name: Upload NeoForge artifacts
        if: env.LOADERS != 'fabric'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: ${{ steps.release.outputs.name }} (NeoForge)
          # Cobblemon 1.8.4 runs on 1.21.1 only; do not let a version range expand to every 1.21.x.
          game-versions: 1.21.1
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-tag: ${{ env.RELEASE_TAG }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: |
            build/libs_neoforge/!(*-@(dev|sources|all)).jar
            build/libs_neoforge/*-@(dev|sources|all).jar
