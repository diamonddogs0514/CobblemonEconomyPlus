name: Build and Release

on:
  release:
    # Only when a release is published (not on create / edit too), so each version is uploaded once.
    types: [published]

# Publishing to Modrinth and CurseForge needs the repository secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN.
env:
  MODRINTH_ID: M7XGBo0H
  CURSEFORGE_ID: 1794401

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Upload Fabric artifacts
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }} # GitHub token is provided by GH automatically

          files: |
            build/libs_fabric/!(*-@(dev|sources|all)).jar
            build/libs_fabric/*-@(dev|sources|all).jar

      - name: Upload Forge artifacts
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: |
            build/libs_neoforge/!(*-@(dev|sources|all)).jar
            build/libs_neoforge/*-@(dev|sources|all).jar
