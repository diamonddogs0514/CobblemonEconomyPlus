modLoader = "javafml"
loaderVersion = "${neo_loader_version_range}"

license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "icon.png"

description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_versions_neo}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cobblemon"
type = "required"
versionRange = "[${cobblemon_version},)"
ordering = "AFTER"
side = "BOTH"

# Optional: the Trainer Card shows Cobblemon Battle Plus Battle Points when it is installed.
# Ordering is NONE because Battle Plus orders itself after this mod.
[[dependencies.${mod_id}]]
modId = "cobblemonbattleplus"
type = "optional"
versionRange = "[3.0.0,)"
ordering = "NONE"
side = "BOTH"

